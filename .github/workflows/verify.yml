name: Verify mathematical research and rebuild PDFs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python and LaTeX dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-xetex texlive-fonts-recommended lmodern ghostscript poppler-utils
      - name: Validate published assets (unchanged from recorded archive)
        run: |
          sha256sum --check publication/ASSET_SHA256SUMS.txt
          python tools/verify_publication.py
      - name: Re-run mathematical regression and seeded simulations in scratch copy
        run: bash tools/run_regression.sh
      - name: Rebuild and validate PDF manuscripts and figures from source
        run: bash tools/build_publications.sh
      - name: Upload freshly built documents and source figures
        uses: actions/upload-artifact@v4
        with:
          name: absolute-luck-verified-publications
          path: |
            manuscript/Absolute_Luck_Phase6_Manuscript.pdf
            essay/Absolute_Luck_Phase7_Essay.pdf
            manuscript/figures/
            essay/figures/
          if-no-files-found: error
          retention-days: 30
